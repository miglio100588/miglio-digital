<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meteo">
<title>Meteo Rovigo</title>
<style>
html,body{margin:0;height:100%;overflow:hidden}
body{color:#fff;font-family:Roboto,"Helvetica Neue",Arial,sans-serif;background:#070B14;
  background-image:linear-gradient(180deg,#070B14 0%,#121A2B 100%);transition:background 3s}
body.p-dawn  {background-image:linear-gradient(180deg,#232A55 0%,#7A4C78 55%,#E3875F 100%)}
body.p-day   {background-image:linear-gradient(180deg,#1F5FA6 0%,#3F86CC 60%,#7DB6E8 100%)}
body.p-golden{background-image:linear-gradient(180deg,#2D4F8C 0%,#B0627A 60%,#F0A04B 100%)}
body.p-dusk  {background-image:linear-gradient(180deg,#0F1430 0%,#3D2A5C 60%,#9B4E5E 100%)}
body.p-night {background-image:linear-gradient(180deg,#070B14 0%,#121A2B 100%)}
#shade{position:fixed;left:0;top:0;right:0;bottom:0;background:#000;opacity:0;pointer-events:none;transition:opacity 3s;z-index:20}
#app{display:flex;height:100%;box-sizing:border-box;padding:2.5vh 2.5vw}
.mut{color:rgba(255,255,255,.66)}
.card{background:rgba(0,0,0,.20);border-radius:1.6vh;box-sizing:border-box}
/* colonna sinistra */
.left{flex:0 0 37%;display:flex;flex-direction:column;padding-right:2.2vw;box-sizing:border-box;min-width:0}
.clock{font-size:14vh;font-weight:300;line-height:.95;letter-spacing:-.02em}
.date{font-size:3.4vh;margin-top:.5vh}
.sun{margin-top:1vh}
.sun svg{display:block;width:100%;height:8vh}
.sunrow{display:flex;justify-content:space-between;font-size:2.6vh;margin-top:.2vh;white-space:nowrap}
.sunrow b{color:#fff;font-weight:500}
.now{display:flex;align-items:center;margin-top:.8vh}
.now .ic{width:10vh;height:10vh}
.temp{font-size:10vh;font-weight:300;line-height:1;margin-left:1.5vw}
.desc{font-size:3.4vh;margin:.3vh 0 .5vh}
.meta{font-size:2.8vh;line-height:1.4;white-space:nowrap}
.meta b{color:#fff;font-weight:500}
/* colonna destra */
.right{flex:1;display:flex;flex-direction:column;min-width:0}
h2{font-size:2.3vh;font-weight:500;text-transform:uppercase;letter-spacing:.14em;margin:0 0 .6vh;color:rgba(255,255,255,.7)}
.alerts{margin-top:.8vh}
.al{display:flex;align-items:center;font-size:2.6vh;line-height:1.3;padding:.3vh 1.2vw;border-radius:1.2vh;margin-bottom:.5vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al i{font-style:normal;font-weight:700;margin-right:1vw;-webkit-flex:0 0 auto;flex:0 0 auto}
.al span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.al.y{background:rgba(242,177,52,.88);color:#2A1D00}
.al.o{background:rgba(232,112,42,.92);color:#fff}
.al.r{background:rgba(200,40,40,.92);color:#fff}
.chart{padding:.8vh 1vw .2vh}
.chart svg{display:block;width:100%;height:28vh}
.days{margin-top:1vh;display:flex;padding:.5vh .4vw}
.dc{flex:1;text-align:center;border-left:1px solid rgba(255,255,255,.12);padding:0 .3vw;min-width:0}
.dc:first-child{border-left:0}
.dc .n{font-size:2.5vh;color:rgba(255,255,255,.75);white-space:nowrap}
.dc .ic{width:5.2vh;height:5.2vh;display:block;margin:.1vh auto}
.dc .t{font-size:2.9vh;white-space:nowrap}
.dc .t b{color:#FFD98A;font-weight:500}.dc .t span{color:#BFE3FF}
.dc .p{font-size:2vh;color:#BFE3FF;white-space:nowrap;min-height:2.6vh}
/* radar (colonna sinistra, in basso) */
.radar{margin-top:1.2vh;flex:1;min-height:34vh;position:relative;overflow:hidden;border-radius:1.6vh;background:#0B1220}
.radar .lay{position:absolute;left:0;top:0;right:0;bottom:0}
.radar img{position:absolute;display:block;border:0;max-width:none}
.radar .fr{visibility:hidden;opacity:.78}
.radar .pin{position:absolute;width:1.6vh;height:1.6vh;margin:-.8vh 0 0 -.8vh;border-radius:50%;background:#FF3B30;border:2px solid #fff;box-shadow:0 0 0 .6vh rgba(255,59,48,.35)}
.radar .rl{position:absolute;left:1vw;top:.8vh;font-size:2.2vh;background:rgba(0,0,0,.45);padding:.2vh .8vw;border-radius:.8vh}
.radar .ra{position:absolute;right:.8vw;bottom:.5vh;font-size:1.5vh;color:rgba(255,255,255,.6);max-width:90%;white-space:nowrap;overflow:hidden}
.radar .rb{position:absolute;left:1vw;right:1vw;bottom:2.6vh;height:.5vh;background:rgba(255,255,255,.15);border-radius:.5vh}
.radar .rb i{position:absolute;top:0;bottom:0;left:0;background:#7CC4FF;border-radius:.5vh}
/* card in fondo a destra: agenda + sport */
.bottom{display:flex;margin-top:.4vh;flex:1;min-height:0}
.bottom .card{padding:.8vh 1vw;overflow:hidden;min-width:0}
.agc{flex:0 0 57%;margin-right:1vh}
.spc{flex:1}
.ag{display:flex;align-items:center;font-size:2.7vh;line-height:1.35;white-space:nowrap;overflow:hidden;margin-bottom:.5vh}
.ag i{flex:0 0 1.5vh;width:1.5vh;height:1.5vh;border-radius:50%;margin-right:1vw}
.ag .aw{flex:0 0 auto;color:#FFD98A;margin-right:1vw}
.ag .at{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ag.none{color:rgba(255,255,255,.6)}
.s{margin-bottom:.5vh}
.s:last-child{margin-bottom:0}
.s1{display:flex;align-items:center;font-size:2.6vh;line-height:1.3;white-space:nowrap;overflow:hidden}
.s2{font-size:2.3vh;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:calc(5vh + 1vw)}
.k{flex:0 0 5vh;font-size:2vh;font-weight:700;border-radius:.6vh;text-align:center;margin-right:1vw;line-height:2.8vh}
.k.f1{background:#E10600}.k.mi{background:#C8102E}.k.it{background:#1F6FD6}.k.u21{background:#4C9BE8}
.s1 .w{overflow:hidden;text-overflow:ellipsis}
.s2 .q{color:#FFD98A}
.s2 .c{color:rgba(255,255,255,.7)}
.foot{font-size:2vh;height:2.4vh;line-height:2.4vh;margin-top:.5vh;color:rgba(255,255,255,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.err{color:#FFB4A8}
/* zone libere per le scritte di Fully (solo se LAYOUT.safe) */
body.safe .right{padding-top:7.5vh}
</style>
</head>
<body class="p-night">
<div id="shade"></div>
<div id="app">
  <div class="left">
    <div class="clock" id="clock">--:--</div>
    <div class="date mut" id="date"></div>
    <div class="sun"><div id="sunSvg"></div><div class="sunrow mut" id="sunRow"></div></div>
    <div class="now"><div id="nowIc"></div><div class="temp" id="nowT">--°</div></div>
    <div class="desc" id="desc">Caricamento…</div>
    <div class="meta mut" id="meta"></div>
    <div class="radar" id="radar"><div class="lay" id="rBase"></div><div class="lay" id="rFrames"></div><div class="lay" id="rLabels"></div>
      <div class="pin" id="rPin"></div><div class="rl" id="rTime">Radar…</div><div class="rb"><i id="rProg"></i></div>
      <div class="ra">RainViewer · Esri, HERE, Garmin, © OpenStreetMap</div></div>
  </div>
  <div class="right">
    <div class="card chart"><h2 id="chTitle">Prossime 24 ore</h2><div id="chart"></div></div>
    <div class="card days" id="days"></div>
    <div class="alerts" id="alerts"></div>
    <div class="bottom">
      <div class="card agc"><h2>Agenda</h2><div id="agenda"></div></div>
      <div class="card spc"><h2>Sport</h2><div id="sport"></div></div>
    </div>
    <div class="foot" id="foot"></div>
  </div>
</div>
<script>var LAYOUT = {name: 'galaxy', agendaMax: 3, chartHours: 25, chartVh: 28, days: 6, safe: false};</script>
<script src="app.js?v=4"></script>
</body>
</html>
