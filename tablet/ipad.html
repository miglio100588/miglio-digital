<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meteo">
<title>Meteo Rovigo</title>
<style>
html,body{margin:0;height:100%;overflow:hidden}
body{color:#fff;font-family:"Helvetica Neue",Roboto,Arial,sans-serif;background:#070B14;
  background-image:linear-gradient(180deg,#070B14 0%,#121A2B 100%);-webkit-transition:background 3s;transition:background 3s}
body.p-dawn  {background-image:linear-gradient(180deg,#232A55 0%,#7A4C78 55%,#E3875F 100%)}
body.p-day   {background-image:linear-gradient(180deg,#1F5FA6 0%,#3F86CC 60%,#7DB6E8 100%)}
body.p-golden{background-image:linear-gradient(180deg,#2D4F8C 0%,#B0627A 60%,#F0A04B 100%)}
body.p-dusk  {background-image:linear-gradient(180deg,#0F1430 0%,#3D2A5C 60%,#9B4E5E 100%)}
body.p-night {background-image:linear-gradient(180deg,#070B14 0%,#121A2B 100%)}
#shade{position:fixed;left:0;top:0;right:0;bottom:0;background:#000;opacity:0;pointer-events:none;-webkit-transition:opacity 3s;transition:opacity 3s;z-index:20}
#app{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;height:100%;box-sizing:border-box;padding:2vh 2vw}
.mut{color:rgba(255,255,255,.66)}
.card{background:rgba(0,0,0,.20);border-radius:1.6vh;box-sizing:border-box;overflow:hidden}
h2{font-size:2.2vh;font-weight:500;text-transform:uppercase;letter-spacing:.14em;margin:0 0 .6vh;color:rgba(255,255,255,.7)}
/* fascia alta */
.top{display:-webkit-flex;display:flex;-webkit-flex:0 0 33vh;flex:0 0 33vh;height:33vh}
.top .card{padding:1.2vh 1.2vw;min-width:0;height:33vh}
.ca{-webkit-flex:0 0 32%;flex:0 0 32%;margin-right:1vw;-webkit-flex:0 0 calc(33% - .67vw);flex:0 0 calc(33% - .67vw)}
.cb{-webkit-flex:0 0 calc(29% - .67vw);flex:0 0 calc(29% - .67vw);margin-right:1vw}
.cc{-webkit-flex:1;flex:1}
.clock{font-size:15vh;font-weight:300;line-height:.95;letter-spacing:-.02em}
.date{font-size:3.4vh;margin-top:.5vh;white-space:nowrap}
.sun{margin-top:.8vh}
.sun svg{display:block;width:100%;height:7vh}
.sunrow{display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between;font-size:2vh;margin-top:.2vh;white-space:nowrap}
.sunrow b{color:#fff;font-weight:500}
.now{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
.now .ic{width:13vh;height:13vh}
.temp{font-size:12vh;font-weight:300;line-height:1;margin-left:1vw}
.desc{font-size:2.9vh;margin:.4vh 0 .6vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:2.5vh;line-height:1.4;white-space:nowrap}
.meta b{color:#fff;font-weight:500}
.alerts{margin-bottom:.4vh}
.al{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;font-size:2.4vh;line-height:1.3;padding:.3vh 1vw;border-radius:1.2vh;margin-bottom:.5vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al i{font-style:normal;font-weight:700;margin-right:1vw;-webkit-flex:0 0 auto;flex:0 0 auto}
.al span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.al.y{background:rgba(242,177,52,.88);color:#2A1D00}
.al.o{background:rgba(232,112,42,.92);color:#fff}
.al.r{background:rgba(200,40,40,.92);color:#fff}
.ag{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;font-size:2.7vh;line-height:1.35;white-space:nowrap;overflow:hidden;margin-bottom:.5vh}
.ag i{-webkit-flex:0 0 1.5vh;flex:0 0 1.5vh;width:1.5vh;height:1.5vh;border-radius:50%;margin-right:1vw}
.ag .aw{-webkit-flex:0 0 auto;flex:0 0 auto;color:#FFD98A;margin-right:1vw}
.ag .at{-webkit-flex:1;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ag.none{color:rgba(255,255,255,.6)}
/* fascia centrale */
.mid{margin-top:1vh;height:26vh;-webkit-flex:0 0 26vh;flex:0 0 26vh;padding:.8vh 1.2vw .2vh}
.mid svg{display:block;width:100%;height:21.6vh}
/* fascia bassa */
.bot{display:-webkit-flex;display:flex;-webkit-flex:1;flex:1;min-height:0;margin-top:1vh}
.radar{-webkit-flex:0 0 52%;flex:0 0 52%;position:relative;overflow:hidden;border-radius:1.6vh;background:#0B1220;margin-right:1vw;-webkit-flex:0 0 calc(52% - .5vw);flex:0 0 calc(52% - .5vw)}
.radar .lay{position:absolute;left:0;top:0;right:0;bottom:0}
.radar img{position:absolute;display:block;border:0;max-width:none}
.radar .fr{visibility:hidden;opacity:.78}
.radar .pin{position:absolute;width:1.8vh;height:1.8vh;margin:-.9vh 0 0 -.9vh;border-radius:50%;background:#FF3B30;border:2px solid #fff;box-shadow:0 0 0 .6vh rgba(255,59,48,.35)}
.radar .rl{position:absolute;left:1vw;top:.8vh;font-size:2.3vh;background:rgba(0,0,0,.45);padding:.2vh .8vw;border-radius:.8vh}
.radar .ra{position:absolute;right:.8vw;bottom:.5vh;font-size:1.5vh;color:rgba(255,255,255,.6);max-width:90%;white-space:nowrap;overflow:hidden}
.radar .rb{position:absolute;left:1vw;right:1vw;bottom:2.6vh;height:.5vh;background:rgba(255,255,255,.15);border-radius:.5vh}
.radar .rb i{position:absolute;top:0;bottom:0;left:0;background:#7CC4FF;border-radius:.5vh}
.rcol{-webkit-flex:1;flex:1;min-width:0;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
.days{display:-webkit-flex;display:flex;padding:.6vh .3vw;-webkit-flex:0 0 auto;flex:0 0 auto}
.dc{-webkit-flex:1;flex:1;text-align:center;border-left:1px solid rgba(255,255,255,.12);padding:0 .1vw;min-width:0}
.dc:first-child{border-left:0}
.dc .n{font-size:2.1vh;color:rgba(255,255,255,.75);white-space:nowrap}
.dc .ic{width:4.6vh;height:4.6vh;display:block;margin:.1vh auto}
.dc .t{font-size:2.3vh;white-space:nowrap}
.dc .t b{color:#FFD98A;font-weight:500}.dc .t span{color:#BFE3FF}
.dc .p{font-size:1.7vh;color:#BFE3FF;white-space:nowrap;min-height:2.2vh;overflow:hidden}
.spc{margin-top:1vh;-webkit-flex:1;flex:1;min-height:0;padding:.6vh 1vw}
.s{margin-bottom:.5vh}
.s:last-child{margin-bottom:0}
.s1{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;font-size:2.6vh;line-height:1.3;white-space:nowrap;overflow:hidden}
.s2{font-size:2.3vh;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:calc(5vh + 1vw)}
.k{-webkit-flex:0 0 5vh;flex:0 0 5vh;font-size:2vh;font-weight:700;border-radius:.6vh;text-align:center;margin-right:1vw;line-height:2.8vh}
.k.f1{background:#E10600}.k.mi{background:#C8102E}.k.it{background:#1F6FD6}.k.u21{background:#4C9BE8}
.s1 .w{overflow:hidden;text-overflow:ellipsis}
.s2 .q{color:#FFD98A}
.s2 .c{color:rgba(255,255,255,.7)}
.foot{font-size:2vh;height:2.4vh;line-height:2.4vh;margin-top:.5vh;color:rgba(255,255,255,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.err{color:#FFB4A8}
</style>
</head>
<body class="p-night">
<div id="shade"></div>
<div id="app">
  <div class="top">
    <div class="card ca">
      <div class="clock" id="clock">--:--</div>
      <div class="date mut" id="date"></div>
      <div class="sun"><div id="sunSvg"></div><div class="sunrow mut" id="sunRow"></div></div>
    </div>
    <div class="card cb">
      <div class="now"><div id="nowIc"></div><div class="temp" id="nowT">--°</div></div>
      <div class="desc" id="desc">Caricamento…</div>
      <div class="meta mut" id="meta"></div>
    </div>
    <div class="card cc">
      <div class="alerts" id="alerts"></div>
      <h2>Agenda</h2><div id="agenda"></div>
    </div>
  </div>
  <div class="card mid"><h2 id="chTitle">Prossime 24 ore</h2><div id="chart"></div></div>
  <div class="bot">
    <div class="radar" id="radar"><div class="lay" id="rBase"></div><div class="lay" id="rFrames"></div><div class="lay" id="rLabels"></div>
      <div class="pin" id="rPin"></div><div class="rl" id="rTime">Radar…</div><div class="rb"><i id="rProg"></i></div>
      <div class="ra">RainViewer · Esri, HERE, Garmin, © OpenStreetMap</div></div>
    <div class="rcol">
      <div class="card days" id="days"></div>
      <div class="card spc"><h2>Sport</h2><div id="sport"></div></div>
    </div>
  </div>
  <div class="foot" id="foot"></div>
</div>
<script>var LAYOUT = {name: 'ipad', agendaMax: 5, agendaAlertsShrink: true, chartHours: 25, chartVh: 21.6, days: 6, safe: false};</script>
<script src="app.js?v=4"></script>
</body>
</html>
